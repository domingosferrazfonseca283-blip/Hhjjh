<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Livro Python</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--accent2:#eff6ff;--code:#111827}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:22px 20px 26px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white}
.brand{max-width:1200px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.75}.brand h1{font-size:28px;margin:6px 0}.brand p{margin:0;opacity:.85}
.app{max-width:1200px;margin:auto;display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 145px)}
aside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}
.search{position:sticky;top:0;background:#fff;padding-bottom:12px;z-index:2}input{width:100%;padding:12px 14px;border:1px solid #d0d5dd;border-radius:12px;font-size:15px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.vol{margin:14px 0 6px;font-weight:750;font-size:14px;color:#344054}.lesson{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;color:#475467;font-size:14px;cursor:pointer}.lesson:hover{background:var(--accent2);color:#1d4ed8}.lesson.active{background:#dbeafe;color:#1d4ed8;font-weight:700}
main{padding:28px}.reader{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 8px 30px rgba(16,24,40,.05);max-width:850px}
.reader h1{font-size:30px;line-height:1.2;margin-top:0}.reader h2{margin-top:28px}.reader h3{margin-top:22px}.reader p{line-height:1.75}.reader ul,.reader ol{line-height:1.7}.reader img{display:block;max-width:100%;height:auto;margin:24px auto;border:1px solid var(--line);border-radius:12px;background:white}.reader pre{background:var(--code);color:#f8fafc;padding:16px;border-radius:12px;overflow:auto;line-height:1.55}.welcome{text-align:center;padding:50px 15px}.welcome .emoji{font-size:52px}.meta{color:var(--muted);font-size:13px}.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:16px;border-radius:12px}
@media(max-width:850px){.app{display:block}aside{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}.lesson{padding:10px}main{padding:14px}.reader{padding:20px;border-radius:14px}.brand h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="brand"><div class="eyebrow">DOMINGOS FERRAZ FONSECA</div><h1>📘 Curso-Livro de Python</h1><p>Do zero ao avançado · biblioteca completa · funciona sem Internet</p></div></header>
<div class="app">
<aside><div class="search"><input id="q" placeholder="🔎 Procurar uma aula"></div><div id="nav"></div></aside>
<main><article class="reader" id="reader"><div class="welcome"><div class="emoji">🐍</div><h1>Bem-vindo ao livro!</h1><p>Escolha um volume e depois uma aula no menu.</p><p class="meta">Todo o conteúdo é carregado do próprio aplicativo.</p></div></article></main>
</div>
<script>
const V=[
["01_INICIO_ABSOLUTO","Volume 1 — Início absoluto",["01_o_que_e_programacao.md","02_o_que_e_python.md","03_primeiro_programa.md","04_texto_e_numeros.md","05_variaveis.md","06_input_e_saida.md","07_erros_e_mensagens.md","08_revisao_e_exercicios.md"]],
["02_FUNDAMENTOS","Volume 2 — Fundamentos",["01_tipos_de_dados.md","02_operadores_matematicos.md","03_comparacoes.md","04_if_else.md","05_elif.md","06_operadores_logicos.md","07_condicoes_aninhadas.md","08_while.md","09_for.md","10_revisao_decisoes_ciclos.md"]],
["03_LOGICA_E_DADOS","Volume 3 — Lógica e dados",["01_listas.md","02_listas_e_for.md","03_metodos_de_listas.md","04_tuplas.md","05_dicionarios.md","06_conjuntos.md","07_comparando_estruturas.md","08_revisao_estruturas.md"]],
["04_FUNCOES","Volume 4 — Funções",["01_o_que_sao_funcoes.md","02_parametros.md","03_return.md","04_parametros_padrao.md","05_escopo.md","06_funcoes_com_listas.md","07_revisao_funcoes.md"]],
["05_POO","Volume 5 — POO",["01_classes_e_objetos.md","02_atributos.md","03_init.md","04_metodos.md","05_encapsulamento.md","06_heranca.md","07_polimorfismo.md","08_revisao_poo.md"]],
["06_MODULOS_FICHEIROS","Volume 6 — Módulos e ficheiros",["01_modulos.md","02_import.md","03_criando_modulos.md","04_arquivos_txt.md","05_open.md","06_csv_json.md","07_pacotes.md","08_revisao_projeto.md"]],
["07_APIS_BANCOS_DADOS","Volume 7 — APIs e bases de dados",["01_o_que_e_api.md","02_requests.md","03_json_api.md","04_status_erros_api.md","05_sql_basico.md","06_sqlite_python.md","07_crud.md","08_projeto_api_banco.md"]],
["08_TESTES_DEBUG","Volume 8 — Testes e debugging",["01_erros_sintaxe.md","02_excecoes.md","03_try_except.md","04_finally_raise.md","05_debugging.md","06_testes_unitarios.md","07_assert_e_pytest.md","08_qualidade_projeto.md"]],
["09_PYTHON_AVANCADO","Volume 9 — Python avançado",["01_list_comprehension.md","02_dict_set_comprehension.md","03_lambda_map_filter.md","04_iteradores.md","05_geradores.md","06_decoradores.md","07_context_managers.md","08_revisao_avancado.md"]],
["10_PYTHON_PROFISSIONAL","Volume 10 — Python profissional",["01_type_hints.md","02_dataclasses.md","03_ambientes_virtuais.md","04_dependencias.md","05_logging.md","06_concorrencia.md","07_desempenho.md","08_padroes_arquitetura.md"]],
["11_PROJETOS_PROFISSIONAIS","Volume 11 — Projetos profissionais",["01_planeamento_projeto.md","02_cli.md","03_api_completa.md","04_autenticacao.md","05_configuracao_segredos.md","06_docker_conceito.md","07_ci_cd.md","08_projeto_final.md"]],
["12_PROJETOS_AVANCADOS","Volume 12 — Projetos avançados",["01_api_com_sqlite.md","02_api_assincrona.md","03_cache.md","04_filtrado_validacao.md","05_seguranca_web.md","06_observabilidade.md","07_perfiling_memoria.md","08_projeto_sistema_completo.md"]],
["13_ENGENHARIA_SOFTWARE","Volume 13 — Engenharia de software",["01_codigo_limpo.md","02_solid.md","03_design_patterns.md","04_dependencia_inversao.md","05_testes_integracao.md","06_git_profissional.md","07_code_review.md","08_arquitetura_hexagonal.md"]],
["14_DADOS_AUTOMACAO_IA","Volume 14 — Dados, automação e IA",["01_python_dados.md","02_csv_pandas.md","03_numpy.md","04_visualizacao_dados.md","05_automacao_arquivos.md","06_web_scraping.md","07_ia_python.md","08_projeto_analise_automacao.md"]],
["15_DESENVOLVIMENTO_WEB","Volume 15 — Desenvolvimento web",["01_web_python.md","02_flask.md","03_rotas_templates.md","04_forms_validacao.md","05_fastapi.md","06_auth_web.md","07_deploy.md","08_projeto_web_completo.md"]],
["16_MACHINE_LEARNING","Volume 16 — Machine Learning",["01_introducao_ml.md","02_dados_treino_teste.md","03_preprocessamento.md","04_regressao.md","05_classificacao.md","06_metricas_modelos.md","07_pipelines_modelos.md","08_projeto_ml.md"]],
["17_DEEP_LEARNING","Volume 17 — Deep Learning",["01_redes_neuronais.md","02_pytorch.md","03_ativacao_backprop.md","04_treino_deep_learning.md","05_overfitting_regularizacao.md","06_cnn_imagens.md","07_nlp_transformers.md","08_projeto_deep_learning.md"]]
];
const nav=document.getElementById("nav"),reader=document.getElementById("reader"),buttons=[];
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function titleOf(f){return f.replace(".md","").replace(/^\d+_/,"").replaceAll("_"," ")}
function renderMd(t){
 let s=esc(t.replace(/\r/g,"")), blocks=[]; s=s.replace(/~~~([\s\S]*?)~~~/g,(m,c)=>{blocks.push("<pre>"+c.trim()+"</pre>");return "@@CODE"+(blocks.length-1)+"@@";});
 s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,a,p)=>{const file=p.split("/").pop();return '<img alt="'+a+'" src="LIVRO_PYTHON/IMAGENS/'+file+'">';});
 s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
 s=s.replace(/\n\n/g,"</p><p>").replace(/\n/g,"<br>");
 s="<p>"+s+"</p>";
 blocks.forEach((b,i)=>s=s.replace("@@CODE"+i+"@@",b));
 return s;
}
function build(){
 V.forEach(([dir,title,files])=>{
  const box=document.createElement("section"); const h=document.createElement("div");h.className="vol";h.textContent=title;box.appendChild(h);
  files.forEach(file=>{
   const b=document.createElement("button");b.className="lesson";b.textContent=titleOf(file);
   b.onclick=async()=>{buttons.forEach(x=>x.classList.remove("active"));b.classList.add("active");reader.innerHTML="<p>A abrir a aula…</p>";try{const r=await fetch("LIVRO_PYTHON/"+dir+"/"+file);if(!r.ok)throw new Error("ficheiro não encontrado");reader.innerHTML=renderMd(await r.text());}catch(e){reader.innerHTML='<div class="error"><strong>Não foi possível abrir esta aula.</strong><br>'+esc(e.message)+"</div>"}};
   box.appendChild(b);buttons.push(b);
  });nav.appendChild(box);
 });
}
build();
document.getElementById("q").oninput=e=>{const q=e.target.value.toLowerCase().trim();buttons.forEach(b=>b.hidden=q&&!b.textContent.toLowerCase().includes(q));};
</script>
</body></html>
