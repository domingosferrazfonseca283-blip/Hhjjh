o_avancado.md"]],["10_PYTHON_PROFISSIONAL","Volume 10 — Python profissional",["01_type_hints.md","02_dataclasses.md","03_ambientes_virtuais.md","04_dependencias.md","05_logging.md","06_concorrencia.md","07_desempenho.md","08_padroes_arquitetura.md"]],["11_PROJETOS_PROFISSIONAIS","Volume 11 — Projetos profissionais",["01_planeamento_projeto.md","02_cli.md","03_api_completa.md","04_autenticacao.md","05_configuracao_segredos.md","06_docker_conceito.md","07_ci_cd.md","08_projeto_final.md"]],["12_PROJETOS_AVANCADOS","Volume 12 — Projetos avançados",["01_api_com_sqlite.md","02_api_assincrona.md","03_cache.md","04_filtrado_validacao.md","05_seguranca_web.md","06_observabilidade.md","07_perfiling_memoria.md","08_projeto_sistema_completo.md"]],["13_ENGENHARIA_SOFTWARE","Volume 13 — Engenharia de software",["01_codigo_limpo.md","02_solid.md","03_design_patterns.md","04_dependencia_inversao.md","05_testes_integracao.md","06_git_profissional.md","07_code_review.md","08_arquitetura_hexagonal.md"]],["14_DADOS_AUTOMACAO_IA","Volume 14 — Dados, automação e IA",["01_python_dados.md","02_csv_pandas.md","03_numpy.md","04_visualizacao_dados.md","05_automacao_arquivos.md","06_web_scraping.md","07_ia_python.md","08_projeto_analise_automacao.md"]],["15_DESENVOLVIMENTO_WEB","Volume 15 — Desenvolvimento web",["01_web_python.md","02_flask.md","03_rotas_templates.md","04_forms_validacao.md","05_fastapi.md","06_auth_web.md","07_deploy.md","08_projeto_web_completo.md"]],["16_MACHINE_LEARNING","Volume 16 — Machine Learning",["01_introducao_ml.md","02_dados_treino_teste.md","03_preprocessamento.md","04_regressao.md","05_classificacao.md","06_metricas_modelos.md","07_pipelines_modelos.md","08_projeto_ml.md"]],["17_DEEP_LEARNING","Volume 17 — Deep Learning",["01_redes_neuronais.md","02_pytorch.md","03_ativacao_backprop.md","04_treino_deep_learning.md","05_overfitting_regularizacao.md","06_cnn_imagens.md","07_nlp_transformers.md","08_projeto_deep_learning.md"]],["18_MLOPS_IA_PRODUCAO","Volume 18 — MLOps e IA em produção",["01_mlop_basico.md","02_versionamento_dados_modelos.md","03_model_registry.md","04_deploy_modelo_api.md","05_monitorizacao_drift.md","06_reprodutibilidade.md","07_ci_cd_ml.md","08_projeto_mlops.md"]]];
const nav=document.getElementById("nav"),reader=document.getElementById("reader"),buttons=[];let current=-1;
const homeHtml='<section class="cover"><div class="mark">📘</div><h1>Curso-Livro de Python</h1><h2>Do Zero ao Avançado</h2><div class="author">Domingos Ferraz Fonseca</div><p class="welcome">Biblioteca offline com 18 volumes, aulas, exercícios, desafios e projetos.</p><button class="start" onclick="openLesson(0,false)">Começar a ler</button></section>';
function showIndex(){
 let h='<section class="chapterhead"><div class="small">Navegação</div><h1>Índice geral</h1><p>Volumes e aulas do Curso-Livro de Python.</p></section><div class="content">';
 let n=0;V.forEach(v=>{h+='<h2>'+esc(v[1])+'</h2><ol>';v[2].forEach(file=>{h+='<li><button class="lesson" style="display:inline-block;width:auto" onclick="openLesson('+n+')">'+esc(titleOf(file))+'</button></li>';n++});h+='</ol>'});h+='</div>';reader.innerHTML=h;document.getElementById("topmeta").textContent="Índice geral";document.getElementById("prog").style.width="0%";
}
document.getElementById("homeBtn").onclick=()=>{reader.innerHTML=homeHtml;document.getElementById("topmeta").textContent="Biblioteca offline";window.scrollTo(0,0)};
document.getElementById("indexBtn").onclick=showIndex;
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function titleOf(f){return f.replace(".md","").replace(/^\d+_/,"").replaceAll("_"," ")}
function renderMd(t){let s=esc(t.replace(/\r/g,"")),blocks=[];s=s.replace(/~~~([\s\S]*?)~~~/g,(m,c)=>{blocks.push("<pre>"+c.trim()+"</pre>");return "@@CODE"+(blocks.length-1)+"@@";});s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,a,p)=>'<img alt="'+a+'" src="LIVRO_PYTHON/IMAGENS/'+p.split("/").pop()+'">');s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");s=s.replace(/\n\n/g,"</p><p>").replace(/\n/g,"<br>");s="<p>"+s+"</p>";blocks.forEach((b,i)=>s=s.replace("@@CODE"+i+"@@",b));return s}
function locate(i){let n=0;for(const v of V)for(const f of v[2]){if(n===i)return[v,f];n++}}
let lessonPages=[],lessonPage=0;
function makePages(html){
  const tmp=document.createElement("div");tmp.innerHTML=html;
  const units=[...tmp.children], pages=[];let page=[],score=0;
  units.forEach(u=>{
    let n=Math.max(1,Math.ceil((u.textContent||"").length/110));
    if(u.tagName==="PRE") n=Math.max(8,Math.ceil((u.textContent||"").split("\n").length));
    if(u.tagName==="IMG") n=14;
    if(page.length && score+n>34){pages.push(page);page=[];score=0}
    page.push(u.cloneNode(true));score+=n;
  });
  if(page.length)pages.push(page);return pages.length?pages:[[]];
}
function showPage(n){
  lessonPage=Math.max(0,Math.min(n,lessonPages.length-1));
  const body=document.getElementById("pagebody");body.innerHTML="";
  lessonPages[lessonPage].forEach(x=>body.appendChild(x));
  document.getElementById("pageNo").textContent="Página "+(lessonPage+1)+" de "+lessonPages.length;
  document.getElementById("pPrev").disabled=lessonPage===0;
  document.getElementById("pNext").disabled=lessonPage===lessonPages.length-1;
  document.getElementById("prog").style.width=((lessonPage+1)/lessonPages.length*100)+"%";
  localStorage.setItem("lastPage_"+current,lessonPage);window.scrollTo(0,0);
}
async function openLesson(i,save=true){
  const hit=locate(i);if(!hit)return;const[v,file]=hit;current=i;
  buttons.forEach(x=>x.classList.remove("active"));buttons[i].classList.add("active");
  reader.innerHTML='<section class="chapterhead"><div class="small">'+v[1]+'</div><h1>'+titleOf(file)+'</h1><p>Aula '+(v[2].indexOf(file)+1)+' de '+v[2].length+' · Assinatura: Domingos Ferraz Fonseca</p></section><section class="pagebox"><div class="pagebody" id="pagebody"><p>A abrir o capítulo…</p></div><div class="pagefoot"><span id="pageNo">Página 1</span><div class="pagebuttons"><button id="pPrev">← Anterior</button><button id="pNext">Próxima →</button></div></div></section><div class="navbottom"><button id="lessonPrev">← Aula anterior</button><button id="lessonNext">Próxima aula →</button></div>';
  try{
    const r=await fetch("LIVRO_PYTHON/"+v[0]+"/"+file);if(!r.ok)throw new Error("ficheiro não encontrado");
    lessonPages=makePages(renderMd(await r.text()));
    const saved=Math.min(Number(localStorage.getItem("lastPage_"+i)||0),lessonPages.length-1);
    showPage(saved);
    document.getElementById("pPrev").onclick=()=>showPage(lessonPage-1);
    document.getElementById("pNext").onclick=()=>showPage(lessonPage+1);
    document.getElementById("lessonPrev").disabled=i===0;document.getElementById("lessonNext").disabled=i===buttons.length-1;
    document.getElementById("lessonPrev").onclick=()=>openLesson(i-1);document.getElementById("lessonNext").onclick=()=>openLesson(i+1);
    document.getElementById("topmeta").textContent=v[1]+" · Aula "+(v[2].indexOf(file)+1);
    if(save)localStorage.setItem("lastLesson",i);
  }catch(e){document.getElementById("pagebody").innerHTML='<div class="error"><strong>Não foi possível abrir este capítulo.</strong><br>'+esc(e.message)+'</div>'}
}
function build(){let n=0;V.forEach(([dir,title,files])=>{const box=document.createElement("section"),h=document.createElement("div");h.className="vol";h.textContent=title;box.appendChild(h);files.forEach(file=>{const b=document.createElement("button");b.className="lesson";b.textContent=titleOf(file);const idx=n++;b.onclick=()=>openLesson(idx);box.appendChild(b);buttons.push(b)});nav.appendChild(box)})}build();
let fontScale=Number(localStorage.getItem("fontScale")||1);
function applyFont(){document.documentElement.style.setProperty("--reader-scale",fontScale);document.querySelector(".book").style.fontSize=fontScale+"em";localStorage.setItem("fontScale",fontScale)}
document.getElementById("fontUp").onclick=()=>{fontScale=Math.min(1.3,fontScale+.05);applyFont()};
document.getElementById("fontDown").onclick=()=>{fontScale=Math.max(.85,fontScale-.05);applyFont()};
document.getElementById("themeBtn").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("dark",document.body.classList.contains("dark"))};
if(localStorage.getItem("dark")==="true")document.body.classList.add("dark");applyFont();
let touchX=0;
reader.addEventListener("touchstart",e=>{touchX=e.changedTouches[0].screenX},{passive:true});
reader.addEventListener("touchend",e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>60){if(dx<0&&lessonPage<lessonPages.length-1)showPage(lessonPage+1);if(dx>0&&lessonPage>0)showPage(lessonPage-1)}},{passive:true});
document.getElementById("q").oninput=e=>{const q=e.target.value.toLowerCase().trim();buttons.forEach(b=>b.hidden=q&&!b.textContent.toLowerCase().includes(q))};document.getElementById("start").onclick=()=>openLesson(Number(localStorage.getItem("lastLesson")||0),false);if(localStorage.getItem("lastLesson")!==null)document.getElementById("start").textContent="Continuar a ler";
</script></body></html>
