<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curso-Livro de Python</title><style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.top{background:#111827;color:white;padding:22px}.top h1{margin:4px 0}.layout{display:grid;grid-template-columns:310px 1fr;min-height:100vh}aside{background:white;padding:16px;border-right:1px solid #ddd;overflow:auto}main{padding:24px;max-width:900px}input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #ccd2dc;border-radius:8px}.vol{font-weight:bold;margin-top:15px}.lesson{display:block;width:100%;text-align:left;background:none;border:0;padding:7px;border-radius:6px}.lesson:hover{background:#e9eefc}article{background:white;padding:25px;border-radius:12px;line-height:1.7}pre{background:#111827;color:white;padding:15px;overflow:auto}img{max-width:100%}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{max-height:40vh;border-right:0;border-bottom:1px solid #ddd}}
</style></head><body><header class="top"><small>DOMINGOS FERRAZ FONSECA</small><h1>📘 Curso-Livro de Python</h1><div>Do Zero ao Avançado · 100% offline</div></header><div class="layout"><aside><input id="q" placeholder="🔎 Procurar aula"><div id="nav">A carregar...</div></aside><main><article id="reader"><h2>Bem-vindo!</h2><p>Escolha uma aula. Todo o conteúdo está dentro do aplicativo.</p></article></main></div><script>
const V=[["01_INICIO_ABSOLUTO","Volume 1 — Início absoluto"],["02_FUNDAMENTOS","Volume 2 — Fundamentos"],["03_LOGICA_E_DADOS","Volume 3 — Lógica e dados"],["04_FUNCOES","Volume 4 — Funções"],["05_POO","Volume 5 — POO"],["06_MODULOS_FICHEIROS","Volume 6 — Módulos e ficheiros"],["07_APIS_BANCOS_DADOS","Volume 7 — APIs e bases de dados"],["08_TESTES_DEBUG","Volume 8 — Testes e debugging"],["09_PYTHON_AVANCADO","Volume 9 — Python avançado"],["10_PYTHON_PROFISSIONAL","Volume 10 — Python profissional"],["11_PROJETOS_PROFISSIONAIS","Volume 11 — Projetos profissionais"],["12_PROJETOS_AVANCADOS","Volume 12 — Projetos avançados"],["13_ENGENHARIA_SOFTWARE","Volume 13 — Engenharia de software"],["14_DADOS_AUTOMACAO_IA","Volume 14 — Dados, automação e IA"],["15_DESENVOLVIMENTO_WEB","Volume 15 — Desenvolvimento web"],["16_MACHINE_LEARNING","Volume 16 — Machine Learning"],["17_DEEP_LEARNING","Volume 17 — Deep Learning"]];
const nav=document.getElementById("nav"),reader=document.getElementById("reader"),buttons=[];
function text(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(t,dir){let s=text(t);s=s.replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/^    (.*)$/gm,"<pre>$1</pre>").replace(/\n\n/g,"</p><p>");return "<p>"+s+"</p>"}
async function load(){for(const [dir,title] of V){const box=document.createElement("div");box.innerHTML='<div class="vol">'+title+"</div>";const r=await fetch("LIVRO_PYTHON/"+dir+"/");const html=await r.text();const names=[...html.matchAll(/href="([^"]+\.md)"/g)].map(x=>x[1]);for(const file of names){const b=document.createElement("button");b.className="lesson";b.textContent=file.replace(".md","").replace(/^\d+_/,"").replaceAll("_"," ");b.onclick=async()=>{const x=await fetch("LIVRO_PYTHON/"+dir+"/"+file);reader.innerHTML=md(await x.text(),dir);};box.append(b);buttons.push(b)}nav.append(box)}}load().catch(()=>nav.textContent="Não foi possível abrir o conteúdo.");document.getElementById("q").oninput=e=>{const q=e.target.value.toLowerCase();buttons.forEach(b=>b.hidden=q&&!b.textContent.toLowerCase().includes(q))};
</script></body></html>
