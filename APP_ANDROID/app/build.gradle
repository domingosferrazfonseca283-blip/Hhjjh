plugins { id 'com.android.application' }

android { namespace 'com.domingosferrazfonseca.livropython'; compileSdk 35

    defaultConfig { applicationId 'com.domingosferrazfonseca.livropython'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
}

tasks.register('copyBook', Copy) {
    from('../LIVRO_PYTHON')
    into('src/main/assets/LIVRO_PYTHON')
}
preBuild.dependsOn(copyBook)

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
