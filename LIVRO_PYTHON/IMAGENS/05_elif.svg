<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#f7f7f7"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">if → elif → else</text><rect x="80" y="110" width="210" height="100" rx="18" fill="#dbeafe"/><text x="185" y="150" text-anchor="middle" font-family="Arial" font-size="24">if</text><text x="185" y="180" text-anchor="middle" font-family="Arial" font-size="18">primeira condição</text><rect x="345" y="110" width="210" height="100" rx="18" fill="#dcfce7"/><text x="450" y="150" text-anchor="middle" font-family="Arial" font-size="24">elif</text><text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="18">outra condição</text><rect x="610" y="110" width="210" height="100" rx="18" fill="#fef3c7"/><text x="715" y="150" text-anchor="middle" font-family="Arial" font-size="24">else</text><text x="715" y="180" text-anchor="middle" font-family="Arial" font-size="18">caso contrário</text><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="22">O Python testa de cima para baixo.</text><text x="450" y="325" text-anchor="middle" font-family="Arial" font-size="22">A primeira condição verdadeira vence.</text></svg>