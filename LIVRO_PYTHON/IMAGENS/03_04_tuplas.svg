<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"><rect width="900" height="430" fill="#f7f7f7"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Tupla: dados agrupados</text><rect x="180" y="125" width="160" height="90" rx="15" fill="#dbeafe"/><text x="260" y="180" text-anchor="middle" font-family="Arial" font-size="21">10</text><rect x="370" y="125" width="160" height="90" rx="15" fill="#dcfce7"/><text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="21">20</text><rect x="560" y="125" width="160" height="90" rx="15" fill="#fef3c7"/><text x="640" y="180" text-anchor="middle" font-family="Arial" font-size="21">30</text><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="23">tupla = (10, 20, 30)</text><text x="450" y="330" text-anchor="middle" font-family="Arial" font-size="21">Boa opção para dados que não precisam mudar.</text></svg>