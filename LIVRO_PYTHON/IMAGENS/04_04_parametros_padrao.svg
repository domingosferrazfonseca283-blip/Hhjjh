<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"><rect width="900" height="430" fill="#f7f7f7"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Parâmetro com valor padrão</text><rect x="150" y="120" width="600" height="100" rx="20" fill="#dbeafe"/><text x="450" y="162" text-anchor="middle" font-family="Arial" font-size="23">def saudacao(nome="amigo"):</text><text x="450" y="198" text-anchor="middle" font-family="Arial" font-size="20">se não enviar nome → usa "amigo"</text><text x="450" y="295" text-anchor="middle" font-family="Arial" font-size="22">saudacao() → amigo</text><text x="450" y="335" text-anchor="middle" font-family="Arial" font-size="22">saudacao("Ana") → Ana</text></svg>