<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430"><rect width="900" height="430" fill="#f7f7f7"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Métodos de listas</text><rect x="80" y="110" width="150" height="85" rx="15" fill="#dbeafe"/><text x="155" y="160" text-anchor="middle" font-family="Arial" font-size="20">append()</text><rect x="260" y="110" width="150" height="85" rx="15" fill="#dcfce7"/><text x="335" y="160" text-anchor="middle" font-family="Arial" font-size="20">insert()</text><rect x="440" y="110" width="150" height="85" rx="15" fill="#fef3c7"/><text x="515" y="160" text-anchor="middle" font-family="Arial" font-size="20">remove()</text><rect x="620" y="110" width="150" height="85" rx="15" fill="#e9d5ff"/><text x="695" y="160" text-anchor="middle" font-family="Arial" font-size="20">sort()</text><text x="450" y="275" text-anchor="middle" font-family="Arial" font-size="23">Cada método realiza uma ação.</text><text x="450" y="320" text-anchor="middle" font-family="Arial" font-size="21">Exemplo: lista.append(valor)</text></svg>