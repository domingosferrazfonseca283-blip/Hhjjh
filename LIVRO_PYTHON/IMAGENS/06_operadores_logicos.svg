<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#f7f7f7"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Operadores lógicos</text><rect x="70" y="110" width="220" height="120" rx="18" fill="#dbeafe"/><text x="180" y="150" text-anchor="middle" font-family="Arial" font-size="28">and</text><text x="180" y="190" text-anchor="middle" font-family="Arial" font-size="18">as duas condições</text><text x="180" y="215" text-anchor="middle" font-family="Arial" font-size="18">precisam ser verdadeiras</text><rect x="340" y="110" width="220" height="120" rx="18" fill="#dcfce7"/><text x="450" y="150" text-anchor="middle" font-family="Arial" font-size="28">or</text><text x="450" y="190" text-anchor="middle" font-family="Arial" font-size="18">pelo menos uma</text><text x="450" y="215" text-anchor="middle" font-family="Arial" font-size="18">precisa ser verdadeira</text><rect x="610" y="110" width="220" height="120" rx="18" fill="#fef3c7"/><text x="720" y="150" text-anchor="middle" font-family="Arial" font-size="28">not</text><text x="720" y="190" text-anchor="middle" font-family="Arial" font-size="18">inverte o valor</text><text x="720" y="215" text-anchor="middle" font-family="Arial" font-size="18">verdadeiro ↔ falso</text><text x="450" y="305" text-anchor="middle" font-family="Arial" font-size="22">Eles ajudam o programa a combinar decisões.</text></svg>