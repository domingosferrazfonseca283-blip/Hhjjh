<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#f7f7f7"/><text x="450" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Mapa: decisões e repetições</text><rect x="70" y="105" width="170" height="80" rx="16" fill="#dbeafe"/><text x="155" y="153" text-anchor="middle" font-family="Arial" font-size="22">if / elif</text><rect x="270" y="105" width="170" height="80" rx="16" fill="#dcfce7"/><text x="355" y="153" text-anchor="middle" font-family="Arial" font-size="22">and / or / not</text><rect x="470" y="105" width="170" height="80" rx="16" fill="#fef3c7"/><text x="555" y="153" text-anchor="middle" font-family="Arial" font-size="22">while</text><rect x="670" y="105" width="170" height="80" rx="16" fill="#e9d5ff"/><text x="755" y="153" text-anchor="middle" font-family="Arial" font-size="22">for</text><text x="450" y="260" text-anchor="middle" font-family="Arial" font-size="24">DECIDIR</text><text x="450" y="300" text-anchor="middle" font-family="Arial" font-size="24">↓</text><text x="450" y="340" text-anchor="middle" font-family="Arial" font-size="24">REPETIR</text><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="20">Com estas ferramentas, os programas começam a ganhar lógica.</text></svg>