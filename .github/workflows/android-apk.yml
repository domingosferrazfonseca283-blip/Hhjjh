name: Construir APK do Livro Python

on:
  workflow_dispatch:
  push:
    paths:
      - 'APP_ANDROID/**'
      - 'LIVRO_PYTHON/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android
        uses: android-actions/setup-android@v3
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Criar wrapper
        working-directory: APP_ANDROID
        run: gradle wrapper --gradle-version 8.10.2
      - name: Construir APK
        working-directory: APP_ANDROID
        run: ./gradlew assembleDebug
      - name: Verificar APK
        working-directory: APP_ANDROID
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Calcular SHA-256
        working-directory: APP_ANDROID
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/LivroPython.apk.sha256
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: LivroPython-v1.2-debug-apk
          path: |
            APP_ANDROID/app/build/outputs/apk/debug/app-debug.apk
            APP_ANDROID/app/build/outputs/apk/debug/LivroPython.apk.sha256
      - name: Guardar relatório do build
        uses: actions/upload-artifact@v4
        with:
          name: LivroPython-build-info
          path: APP_ANDROID/app/build/outputs/apk/debug/LivroPython.apk.sha256
